<!DOCTYPE html>
<html lang="pt-BR" data-theme="escuro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Agenda Inteligente</title>
<meta name="theme-color" content="#0c1322" id="themeColor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agenda">
<link rel="manifest" href="manifest.webmanifest" id="mf">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--fs:16px;--ff:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--red:#ef4444;--amb:#f59e0b;--grn:#10b981;--pk:#ec4899;--vio:#8b5cf6;--blu:#3b82f6;--acx:#fff;--hh:52px}
[data-theme=claro]{color-scheme:light;--bg:#f3f5fa;--card:#fff;--card2:#eef1f8;--bd:#dce2ef;--tx:#0f172a;--mut:#64748b;--ac:#2563eb}
[data-theme=escuro]{color-scheme:dark;--bg:#0c1322;--card:#141d31;--card2:#1b2742;--bd:#27344f;--tx:#e8edf7;--mut:#8b98b4;--ac:#3b78f0}
[data-theme=amoled]{color-scheme:dark;--bg:#000;--card:#0b0b0d;--card2:#16161a;--bd:#25252b;--tx:#f1f1f3;--mut:#8d8d96;--ac:#3b78f0}
[data-theme=sepia]{color-scheme:light;--bg:#efe4cb;--card:#f7eed8;--card2:#e9dcbd;--bd:#d5c49d;--tx:#3f3020;--mut:#7f6c52;--ac:#a35a1c}
[data-theme=papel]{color-scheme:light;--bg:#f6f4ee;--card:#fffefb;--card2:#efece3;--bd:#e0dccf;--tx:#1f1f1f;--mut:#76736a;--ac:#374151}
[data-theme=azul]{color-scheme:dark;--bg:#06182e;--card:#0c2542;--card2:#12335a;--bd:#1d4577;--tx:#e6f1ff;--mut:#8fb0d6;--ac:#38bdf8;--acx:#032037}
[data-theme=verde]{color-scheme:light;--bg:#ecf6ef;--card:#fff;--card2:#e0efe5;--bd:#cfe3d6;--tx:#10281b;--mut:#5f7a69;--ac:#15803d}
[data-theme=roxo]{color-scheme:dark;--bg:#150f27;--card:#201738;--card2:#2c2150;--bd:#3d2f6b;--tx:#efe9ff;--mut:#a597cf;--ac:#a78bfa;--acx:#1b0f3a}
[data-theme=vermelho]{color-scheme:light;--bg:#fbf0f0;--card:#fff;--card2:#f6e2e2;--bd:#ecd0d0;--tx:#2a1010;--mut:#8a5f5f;--ac:#dc2626}
[data-theme=laranja]{color-scheme:light;--bg:#fff4e8;--card:#fff;--card2:#fbe8d3;--bd:#f2d6b6;--tx:#2c1a0a;--mut:#8c6a48;--ac:#c2410c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--ff);line-height:1.35;-webkit-user-select:none;user-select:none;overscroll-behavior-y:contain}
input,select,textarea,button{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
svg{display:block;flex:none}
.noanim *{transition:none!important;animation:none!important}
#app{max-width:520px;margin:0 auto;padding:0 14px calc(138px + env(safe-area-inset-bottom));min-height:100dvh}
.view{display:none}.view.on{display:block}
h1,h2,h3,h4{margin:0}
.row{display:flex;align-items:center;gap:8px}
.sp{flex:1}
.mut{color:var(--mut)}.sm{font-size:.78rem}.xs{font-size:.7rem}
.hdr{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.hdr h1{font-size:1.25rem;line-height:1.1}
.hdr small{color:var(--mut);font-size:.74rem}
.ib{width:40px;height:40px;border-radius:13px;background:var(--card);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;position:relative}
.ib .bd{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:.65rem;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.btn{background:var(--ac);color:var(--acx);border-radius:13px;padding:10px 16px;font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.sec{background:var(--card2);color:var(--tx);border:1px solid var(--bd)}
.btn.red{background:var(--red);color:#fff}
.btn.sm{padding:6px 11px;font-size:.78rem;border-radius:10px}
.btn.blk{width:100%}
.btn[disabled]{opacity:.45}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:13px;margin-top:12px}
.card>h3,.card>summary{font-size:.95rem;font-weight:700}
.card h3 .mut{font-weight:500}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.ch h3{font-size:.95rem}
.link{color:var(--ac);font-size:.8rem;font-weight:600}
.seg{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button,.chip{padding:7px 12px;border-radius:12px;background:var(--card);border:1px solid var(--bd);font-size:.82rem;white-space:nowrap;flex:none;color:var(--tx)}
.seg button.on,.chip.on{background:var(--ac);border-color:var(--ac);color:var(--acx);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip.sw{width:30px;height:30px;padding:0;border-radius:50%;border:2px solid transparent}
.chip.sw.on{outline:2px solid var(--tx);outline-offset:1px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
.tabs>div{display:flex;max-width:520px;margin:0 auto}
.tabs button{flex:1;padding:8px 0 6px;font-size:.62rem;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.tabs button.on{color:var(--ac);font-weight:700}
.tabs .bd{position:absolute;top:3px;left:55%;min-width:15px;height:15px;border-radius:8px;background:var(--red);color:#fff;font-size:.6rem;display:flex;align-items:center;justify-content:center;padding:0 3px}
.fab{position:fixed;right:max(16px,calc(50% - 244px));bottom:calc(74px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--ac);color:var(--acx);box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:25;display:flex;align-items:center;justify-content:center;font-size:2rem;line-height:1}
/* calendário */
.nav{display:flex;align-items:center;justify-content:space-between;margin:2px 0 8px;gap:6px}
.nav h2{font-size:1.05rem;text-transform:capitalize;text-align:right}
.nav .ib{width:36px;height:36px;border-radius:11px}
.mg{display:grid;grid-template-columns:22px repeat(7,1fr);gap:4px}
.mg .dw{text-align:center;font-size:.68rem;font-weight:700;color:var(--mut);padding-bottom:2px}
.mg .wk{font-size:.6rem;color:var(--mut);display:flex;align-items:center;justify-content:center;opacity:.8}
.cell{height:50px;border-radius:12px;background:var(--card);border:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:5px 1px 4px;font-size:.85rem;font-weight:500;color:var(--tx);position:relative}
.cell.out{opacity:.38}
.cell.fer{color:var(--red)}
.cell.hoje{border-color:var(--ac);color:var(--ac);font-weight:800}
.cell.sel{background:var(--ac);border-color:var(--ac);color:var(--acx);font-weight:800}
.cell.alvo{outline:2px dashed var(--ac);outline-offset:1px}
.dots{display:flex;gap:2px;height:6px;align-items:center}
.dot{width:6px;height:6px;border-radius:50%;flex:none}
.cell.sel .dot{box-shadow:0 0 0 1px rgba(255,255,255,.7)}
.cell .more{font-size:.5rem;line-height:1}
.panel{margin-top:12px;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:13px}
.panel h3{font-size:.98rem}.panel h3::first-letter{text-transform:uppercase}
.fer-l{font-size:.76rem;font-weight:600;margin-top:2px}
.fer-l.n,.fer-l.e,.fer-l.m{color:var(--red)}.fer-l.p{color:var(--amb)}.fer-l.c{color:var(--vio)}
.it{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--bd);border-radius:14px;padding:9px 10px;margin-top:8px;border-left:4px solid var(--c,var(--ac));position:relative;touch-action:pan-y}
.it.done .tt{text-decoration:line-through;opacity:.55}
.it .ic{font-size:1.15rem;width:30px;text-align:center;flex:none}
.it .tx{flex:1;min-width:0}
.it .tt{font-weight:700;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .sb{font-size:.74rem;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it.drag{opacity:.35}
.ghost{position:fixed;z-index:300;pointer-events:none;background:var(--ac);color:var(--acx);padding:7px 11px;border-radius:12px;font-size:.8rem;font-weight:700;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.ck{width:26px;height:26px;border-radius:8px;border:2px solid var(--mut);flex:none;display:flex;align-items:center;justify-content:center;color:transparent}
.ck.on{background:var(--grn);border-color:var(--grn);color:#fff}
.vazio{text-align:center;color:var(--mut);font-size:.85rem;padding:22px 8px}
.vazio b{display:block;font-size:1rem;color:var(--tx);margin-bottom:4px}
.dayh{font-size:.72rem;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin:16px 0 0}
/* timeline */
.tlw{height:calc(100dvh - 330px);min-height:300px;overflow-y:auto;border:1px solid var(--bd);border-radius:16px;background:var(--card);position:relative;overscroll-behavior:contain}
.tl{position:relative;display:flex;height:calc(var(--hh)*24)}
.tl .hrs{width:38px;flex:none;position:relative}
.tl .hrs span{position:absolute;left:0;width:34px;text-align:right;font-size:.62rem;color:var(--mut);transform:translateY(-50%)}
.tl .cols{flex:1;display:flex;position:relative}
.tl .col{flex:1;position:relative;border-left:1px solid var(--bd)}
.tl .col.hoje{background:color-mix(in srgb,var(--ac) 7%,transparent)}
.tl .ln{position:absolute;left:0;right:0;border-top:1px solid var(--bd);opacity:.7;pointer-events:none}
.blk{position:absolute;border-radius:8px;padding:2px 4px;font-size:.68rem;line-height:1.15;overflow:hidden;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 24%,var(--card));color:var(--tx);touch-action:pan-y;min-height:16px}
.blk b{display:block;font-size:.7rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blk.done{opacity:.5}
.blk.drag{opacity:.75;box-shadow:0 6px 18px rgba(0,0,0,.45);z-index:50}
.agora{position:absolute;left:0;right:0;border-top:2px solid var(--red);z-index:5;pointer-events:none}
.agora:before{content:"";position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.wh{display:flex;margin-left:38px}
.wh button{flex:1;text-align:center;font-size:.66rem;color:var(--mut);padding:3px 0;border-radius:9px}
.wh button b{display:block;font-size:.95rem;color:var(--tx)}
.wh button.hoje b{color:var(--ac)}
.wh button.sel{background:var(--card)}
.allday{display:flex;margin:0 0 6px 38px;min-height:6px}
.allday>div{flex:1;display:flex;flex-direction:column;gap:2px;padding:0 1px}
.allday span{font-size:.6rem;border-radius:6px;padding:1px 4px;background:color-mix(in srgb,var(--c) 30%,var(--card));border-left:3px solid var(--c);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* tarefas */
.tk{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:11px;margin-top:8px}
.tk .top{display:flex;gap:10px;align-items:flex-start}
.tk .tt{font-weight:700;font-size:.95rem}
.tk.done .tt{text-decoration:line-through;opacity:.55}
.tag{display:inline-flex;align-items:center;gap:3px;font-size:.68rem;padding:2px 7px;border-radius:8px;background:var(--card2);border:1px solid var(--bd);color:var(--mut);margin:3px 4px 0 0}
.tag.late{color:var(--red);border-color:var(--red)}
.tag.p2{color:var(--red)}.tag.p1{color:var(--amb)}.tag.p0{color:var(--blu)}
.prog{height:5px;border-radius:3px;background:var(--card2);margin-top:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--grn);border-radius:3px}
.subs{margin:8px 0 0 36px}
.sub{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:.88rem}
.sub .ck{width:20px;height:20px;border-radius:6px}
.sub.done span{text-decoration:line-through;opacity:.55}
/* notas */
.nt{columns:2;column-gap:10px}
.nc{break-inside:avoid;background:color-mix(in srgb,var(--c,transparent) 22%,var(--card));border:1px solid var(--bd);border-radius:16px;padding:11px;margin-bottom:10px;font-size:.84rem;overflow:hidden}
.nc h4{font-size:.9rem;margin-bottom:4px;word-break:break-word}
.nc p{margin:0;white-space:pre-wrap;word-break:break-word;color:var(--tx);opacity:.88;max-height:9.5em;overflow:hidden}
.nc .li{display:flex;gap:6px;margin-top:2px}
.nc .bdg{margin-top:7px;font-size:.7rem;color:var(--mut);display:flex;gap:7px;flex-wrap:wrap}
/* campos */
.in,select.in,textarea.in{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;font-size:.95rem;-webkit-user-select:text;user-select:text;color:var(--tx)}
textarea.in{resize:vertical;min-height:70px}
.in:focus{outline:2px solid var(--ac);outline-offset:0}
label.l{display:block;font-size:.72rem;color:var(--mut);margin:12px 0 4px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--bd)}
.srow:last-child{border:0}
.srow small{display:block;color:var(--mut);font-size:.74rem}
.swt{position:relative;width:46px;height:27px;flex:none}
.swt input{display:none}
.swt i{position:absolute;inset:0;background:var(--bd);border-radius:20px;transition:.2s}
.swt i:after{content:"";position:absolute;left:3px;top:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s}
.swt input:checked+i{background:var(--grn)}
.swt input:checked+i:after{transform:translateX(19px)}
details.card>summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary:after{content:"›";transform:rotate(90deg);font-size:1.3rem;color:var(--mut)}
details.card[open]>summary:after{transform:rotate(-90deg)}
details.card[open]>summary{margin-bottom:6px}
/* sheets */
.modal{position:fixed;inset:0;background:rgba(2,6,16,.66);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fi .15s}
@keyframes fi{from{opacity:0}}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:93dvh;overflow-y:auto;border-radius:24px 24px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));border:1px solid var(--bd);animation:su .22s;overscroll-behavior:contain}
.sheet.full{height:93dvh}
@keyframes su{from{transform:translateY(40px);opacity:.5}}
.sheet .gh{width:42px;height:4px;border-radius:2px;background:var(--bd);margin:-6px auto 10px}
.sheet h3{font-size:1.1rem;margin-bottom:4px}
.sheet .foot{position:sticky;bottom:-18px;background:var(--bg);padding:12px 0 4px;display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.big{font-size:1.5rem}
/* alerta */
.ring{position:fixed;inset:0;z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:linear-gradient(160deg,#0b1220,#1e3a8a);color:#fff;overflow-y:auto}
.ring.on{display:flex}
.ring.alarm{background:linear-gradient(160deg,#7c2d12,#dc2626);animation:pulse 1s infinite alternate}
@keyframes pulse{to{filter:brightness(1.25)}}
.ring .ri{font-size:78px;line-height:1}
.ring .rh{font-size:3rem;font-weight:800;margin:4px 0}
.ring h2{font-size:1.5rem;margin:4px 0;word-break:break-word}
.ring p{margin:2px 0 18px;opacity:.9;max-width:320px}
.ring .btn{font-size:1.05rem;padding:13px 22px;margin:5px;min-width:230px;background:#fff;color:#111}
.ring .btn.g{background:rgba(255,255,255,.2);color:#fff}
.ring .adi{display:none;gap:6px;flex-wrap:wrap;justify-content:center;max-width:340px;margin-bottom:6px}
.ring .adi.on{display:flex}
.ring .adi button{background:rgba(255,255,255,.22);color:#fff;border-radius:12px;padding:9px 13px;font-weight:600;font-size:.88rem}
/* bloqueio */
.lock{position:fixed;inset:0;z-index:150;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.lock.on{display:flex}
.pins{display:flex;gap:12px;margin:18px 0}
.pins i{width:14px;height:14px;border-radius:50%;border:2px solid var(--mut)}
.pins i.on{background:var(--ac);border-color:var(--ac)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
.pad button{height:62px;border-radius:50%;background:var(--card);border:1px solid var(--bd);font-size:1.4rem;font-weight:600}
#toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(140px);background:var(--card);border:1px solid var(--bd);padding:10px 16px;border-radius:14px;z-index:300;font-size:.85rem;transition:.3s;max-width:90%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#toast.on{transform:translateX(-50%) translateY(0)}
#toast{pointer-events:none}
.banner{background:var(--card);border:1px solid var(--amb);border-radius:14px;padding:10px 12px;margin-bottom:8px;font-size:.82rem}
.banner b{display:block;margin-bottom:2px}
.banner.info{border-color:var(--ac)}
.hero{background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 55%,#000));color:var(--acx);border-radius:22px;padding:16px;margin-top:4px}
.hero h2{font-size:1.35rem}
.hero p{margin:3px 0 0;opacity:.9;font-size:.85rem}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.qa button{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 2px;font-size:.7rem;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
.qa button span{font-size:1.25rem}
.av{width:42px;height:42px;border-radius:50%;background:var(--card2);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-weight:800;overflow:hidden;flex:none;font-size:1rem;color:var(--ac)}
.av img{width:100%;height:100%;object-fit:cover}
.bar{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:.8rem}
.bar i{display:block;height:9px;border-radius:5px;background:var(--ac);min-width:3px}
.bar b{width:92px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.stat>div{background:var(--card2);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.4rem}
.stat span{font-size:.72rem;color:var(--mut)}
.fl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}
.anx .a{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 10px;margin-top:6px;font-size:.84rem}
.anx .a span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-block;font-size:.66rem;font-weight:700;padding:2px 8px;border-radius:9px;background:var(--ac);color:var(--acx)}
.kv{display:flex;gap:8px;padding:6px 0;font-size:.88rem;border-bottom:1px dashed var(--bd)}
.kv:last-child{border:0}
.kv b{width:92px;color:var(--mut);font-weight:600;flex:none}
</style>
</head>
<body>
<div id="app">
  <header class="hdr">
    <div><h1 id="hTit">Início</h1><small id="hSub"></small></div>
    <div class="row">
      <button class="ib" data-act="buscar" aria-label="Pesquisar" id="bBusca"></button>
      <button class="ib" data-act="ir-lembretes" aria-label="Lembretes" id="bSino"></button>
    </div>
  </header>
  <div id="avisos"></div>
  <main>
    <section class="view" id="v-inicio"></section>
    <section class="view" id="v-cal"></section>
    <section class="view" id="v-tarefas"></section>
    <section class="view" id="v-lembretes"></section>
    <section class="view" id="v-notas"></section>

/* ================= histórico ================= */
function logHist(p,acao){S.hist.unshift({t:Date.now(),titulo:p.titulo||p.tit,corpo:p.corpo||'',tipo:p.tipo,acao});if(S.hist.length>250)S.hist.length=250}
function logConcl(tipo,o){S.log.unshift({t:Date.now(),tipo,id:o.id,cat:o.cat||''});if(S.log.length>2500)S.log.length=2500}

/* ================= conclusão ================= */
function concluirTarefa(id,flag=true){const o=S.tarefas.find(x=>x.id===id);if(!o)return;
 if(flag){logConcl('tarefa',o);
  if(o.rep&&o.rep!=='nao'){const prox=proxOcorrencia(o,addD(pY(o.data),1));if(prox){o.data=ymd(prox);(o.subs||[]).forEach(s=>s.done=false);toast('Próxima: '+fmtData(prox));limparFired('ta',o.id);salvar();return}}
  o.done=true;o.doneAt=Date.now();(o.subs||[]).forEach(s=>s.done=true)}
 else{o.done=false;o.doneAt=0}
 salvar()}
function marcarFeito(src,id,ds,flag=true){
 if(src==='ev'){const k='ev:'+id+'|'+ds;if(flag){S.feitos[k]=Date.now();const o=S.eventos.find(x=>x.id===id);if(o)logConcl('evento',o)}else delete S.feitos[k]}
 else if(src==='ta')concluirTarefa(id,flag);
 else if(src==='no'){const o=S.notas.find(x=>x.id===id);if(o)o.avisar=!flag?o.avisar:false}
 salvar()}
function limparFired(src,id){const p=src+':'+id+'|';Object.keys(S.fired).forEach(k=>{if(k.startsWith(p))delete S.fired[k]});S.soneca=S.soneca.filter(s=>!(s.p&&s.p.src===src&&s.p.id===id))}

/* ================= áudio / vibração ================= */
let ac=null;
function audio(){try{if(!ac){const C=window.AudioContext||window.webkitAudioContext;if(C)ac=new C()}if(ac&&ac.state==='suspended')ac.resume()}catch(e){}return ac}
['pointerdown','touchstart','keydown','click'].forEach(ev=>document.addEventListener(ev,audio,{passive:true}));
function nota(f,ini,dur,tipo,vol){const c=audio();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=tipo;o.frequency.value=f;
 const t0=c.currentTime+ini;g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(Math.max(.001,vol*S.cfg.vol),t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
 o.connect(g);g.connect(c.destination);o.start(t0);o.stop(t0+dur+.05)}
const SONS={
 alarme:()=>{for(let i=0;i<4;i++)nota(880,i*.28,.18,'square',.35)},
 digital:()=>{for(let i=0;i<6;i++)nota(i%2?1200:900,i*.22,.16,'triangle',.6)},
 suave:()=>{nota(659,0,.5,'sine',.5);nota(880,.45,.6,'sine',.5);nota(1047,.95,.7,'sine',.5)},
 sino:()=>{[0,.9].forEach(t=>[1,2.4,4.1].forEach((m,i)=>nota(660*m,t,1.5-i*.35,'sine',.5/(i+1))))},
 melodia:()=>{[523,659,784,1047,784,659,523,659].forEach((f,i)=>nota(f,i*.2,.25,'triangle',.5))},
 mudo:()=>{}};
function tocar(nome){(SONS[nome]||SONS.alarme)()}
function vibrar(p){if(S.cfg.vibrar&&navigator.vibrate)try{navigator.vibrate(p)}catch(e){}}
const somDe=tipo=>S.cfg.sons[tipo]||'alarme';

/* ================= notificações do sistema ================= */
let swReg=null;
const temNotif=()=>'Notification' in window;
const permNotif=()=>temNotif()?Notification.permission:'unsupported';
async function pedirPermissao(){if(!temNotif()){toast('Este navegador não suporta notificações');return}
 try{await Notification.requestPermission()}catch(e){}
 renderAvisos();if(abaAtual==='config')render();if(Notification.permission==='granted')toast('Notificações ativadas ✅');
 else if(Notification.permission==='denied')toast('Permissão negada. Libere nas configurações do navegador.')}
async function notificarSistema(p){
 if(permNotif()!=='granted')return;
 const ocul=S.cfg.ocultarNotif;
 const titulo=ocul?'Agenda: lembrete':`${p.ic||''} ${p.titulo}`.trim(),corpo=ocul?'Toque para ver':(p.corpo||'');
 const dado={p:{key:p.key,src:p.src,id:p.id,ds:p.ds,titulo:p.titulo,corpo:p.corpo,tipo:p.tipo,som:p.som,ring:p.ring,min:p.min,ic:p.ic}};
 const opts={body:corpo,tag:p.key,icon:'icon-192.png',badge:'icon-192.png',vibrate:S.cfg.vibrar?[300,150,300,150,600]:undefined,requireInteraction:!!(p.persist||p.ring),renotify:true,data:dado,
  actions:(p.src==='pe'||p.min>0)?[]:[{action:'feito',title:'✓ Concluído'},{action:'adiar',title:'⏳ Adiar 10 min'}]};
 try{const reg=swReg||(navigator.serviceWorker&&await navigator.serviceWorker.getRegistration());if(reg){await reg.showNotification(titulo,opts);return}}catch(e){}
 try{delete opts.actions;new Notification(titulo,opts)}catch(e){}}

/* ================= fila de alertas (tela cheia) ================= */
let fila=[],atual=null,ringTimer=null,ringStop=null;
function alertar(p){logHist(p,'disparado');
 if(document.hidden||!document.hasFocus()||p.persist)notificarSistema(p);
 fila.push(p);if(!atual)proximoAlerta();salvar()}
function proximoAlerta(){pararToque();atual=fila.shift();const r=$('#ring');
 if(!atual){r.classList.remove('on','alarm');$('#rAdi').classList.remove('on');return}
 const oculto=S.cfg.ocultarNotif&&$('#lock').classList.contains('on');
 $('#rIc').textContent=atual.ic||'🔔';$('#rHora').textContent=atual.hora?fmtHora(atual.hora):'';
 $('#rTit').textContent=oculto?'Lembrete':atual.titulo;$('#rCorpo').textContent=oculto?'':(atual.corpo||'');
 const soInfo=atual.src==='pe'||atual.min>0;
 $('#rFeito').textContent=soInfo?'👍 Entendido':'✓ Concluído';$('#rOk').style.display=soInfo?'none':'';
 $('#rAdi').classList.remove('on');r.classList.toggle('alarm',!!atual.ring);r.classList.add('on');
 if(atual.ring)iniciarToque();else{tocar(atual.som?somDe(atual.som):'suave');vibrar([250,120,250])}}
function iniciarToque(){const nome=somDe(atual.som);const ciclo=()=>{tocar(nome);vibrar([500,200,500,200,500])};ciclo();ringTimer=setInterval(ciclo,2800);
 ringStop=setTimeout(()=>{ // sem resposta: repete conforme configuração
  if(!atual)return;const p=atual;logHist(p,'sem resposta');
  if(p.src!=='x'&&(p.rep||0)<S.cfg.repVezes){S.soneca.push({t:Date.now()+S.cfg.repMin*60000,p:Object.assign({},p,{rep:(p.rep||0)+1,corpo:'🔁 Repetindo ('+((p.rep||0)+1)+'/'+S.cfg.repVezes+') · '+(p.corpo||'').replace(/^🔁[^·]*·\s*/,'')})});salvar()}
  atual=null;proximoAlerta()},3*60000)}
function pararToque(){clearInterval(ringTimer);clearTimeout(ringStop);ringTimer=ringStop=null;if(navigator.vibrate)try{navigator.vibrate(0)}catch(e){}}
function limparSonecaChave(k){S.soneca=S.soneca.filter(s=>s.p.key!==k)}
function alFeito(){if(!atual)return;const p=atual;
 if(p.src!=='pe'&&!(p.min>0)){marcarFeito(p.src,p.id,p.ds,true);logHist(p,'concluído')}else logHist(p,'visto');
 limparSonecaChave(p.key);atual=null;proximoAlerta();renderAvisos();render()}
function alOk(){if(!atual)return;logHist(atual,'dispensado');atual=null;proximoAlerta();salvar()}
function alSoneca(min,rot){if(!atual)return;const p=atual;
 let t=Date.now()+min*60000;if(min==='amanha'){const a=addD(new Date(),1);t=atT(a,S.cfg.horaPadrao).getTime();rot='amanhã'}
 limparSonecaChave(p.key);S.soneca.push({t,p:Object.assign({},p,{rep:0,corpo:'⏳ Adiado · '+(p.corpo||'').replace(/^(⏳|🔁)[^·]*·\s*/,'')})});
 logHist(p,rot==='lembrar'?'lembrar novamente':'adiado');atual=null;proximoAlerta();salvar();toast(rot==='lembrar'?`Lembrarei em ${min} min`:`Adiado${rot?' para '+rot:''}`)}

/* ================= motor de alarmes ================= */
function gatilhos(d){return itensDoDia(d).filter(it=>it.avisar&&!it.done).map(it=>Object.assign({},it,{t:atT(d,it.horaAl||S.cfg.horaPadrao).getTime()}))}
function offsetsDe(g){const s=new Set([0]);(g.antes||[]).forEach(m=>{if(m>0)s.add(m)});return[...s]}
function corpoDe(g,min){
 if(min>0)return `Começa em ${lblAntes(min)}`+(g.hora?` · ${fmtHora(g.hora)}`:'')+(g.obj.local?` · 📍 ${g.obj.local}`:'');
 if(g.src==='pe'){const n=idadeEm(g.obj,pY(g.ds).getFullYear());return n?`Hoje é aniversário! Faz ${n} anos 🎉`:'Hoje é aniversário! 🎉'}
 if(g.tipo==='despertador')return g.obj.obs||'Hora de acordar!';
 if(g.tipo==='consulta')return [g.obj.esp,g.obj.local&&('📍 '+g.obj.local),g.obj.obs].filter(Boolean).join(' · ')||'Hora da consulta';
 return g.obj.obs||g.obj.notas||(g.src==='ta'?'Tarefa no prazo':'Está na hora!')}
let ultimo=+(function(){try{return localStorage.getItem('ai_last')}catch(e){return 0}})()||Date.now();
let ultimoSalvo=0;
function checarAlarmes(){const agora=Date.now();let mudou=false;const base=new Date();
 for(let o=-1;o<=1;o++){const d=addD(base,o);
  for(const g of gatilhos(d)){for(const min of offsetsDe(g)){const t=g.t-min*60000,k=g.src+':'+g.id+'|'+g.ds+'|'+min;
   if(S.fired[k]||t>agora||t<=ultimo)continue;S.fired[k]=agora;mudou=true;
   if(agora-t<=JANELA)alertar({key:k,src:g.src,id:g.id,ds:g.ds,titulo:g.tit,corpo:corpoDe(g,min),tipo:g.tipo,som:g.som,ic:min>0?'⏰':g.ic,hora:g.hora||g.horaAl,ring:(g.alarme&&min===0),persist:g.persist&&min===0,min,rep:0});
   else{S.perdidos.unshift({t,titulo:g.tit,tipo:g.tipo,ic:g.ic});S.perdidos=S.perdidos.slice(0,40);logHist({titulo:g.tit,tipo:g.tipo,corpo:''},'perdido')}}}}
 const resto=[];for(const s of S.soneca){if(s.t<=agora){alertar(Object.assign({},s.p,{key:s.p.key+'~'+s.t}));mudou=true}else resto.push(s)}
 if(resto.length!==S.soneca.length)S.soneca=resto;
 ultimo=agora;if(agora-ultimoSalvo>15000){ultimoSalvo=agora;try{localStorage.setItem('ai_last',String(agora))}catch(e){}}
 if(mudou){const corte=agora-4*864e5;Object.keys(S.fired).forEach(k=>{if(S.fired[k]<corte)delete S.fired[k]});salvar();renderAvisos();if(!document.hidden)render()}}
let diaRender=ymd(new Date());
function tick(){const n=new Date();checarAlarmes();if(ymd(n)!==diaRender){diaRender=ymd(n);render()}
 const s=$('#relogio');if(s)s.textContent=`${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`}
function iniciarTicker(){try{const w=new Worker(URL.createObjectURL(new Blob(['setInterval(function(){postMessage(1)},1000)'])));w.onmessage=tick}catch(e){setInterval(tick,1000)}setInterval(tick,5000)}
let wl=null;
async function aplicarWake(){try{if(S.cfg.wake&&'wakeLock' in navigator&&document.visibilityState==='visible'){if(!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>wl=null)}}else if(wl){await wl.release();wl=null}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){tick();aplicarWake();verificarBloqueioAoVoltar()}else{hiddenAt=Date.now()}});
window.addEventListener('focus',tick);window.addEventListener('pageshow',tick);

/* ================= ações vindas da notificação do sistema ================= */
function acaoDeNotificacao(acao,p){if(!p)return;
 if(acao==='feito'&&p.src!=='pe'&&!(p.min>0)){marcarFeito(p.src,p.id,p.ds,true);logHist(p,'concluído');toast('Concluído ✓')}
 else if(acao==='adiar'){S.soneca.push({t:Date.now()+10*60000,p:Object.assign({},p,{rep:0,corpo:'⏳ Adiado · '+(p.corpo||'')})});logHist(p,'adiado');toast('Adiado 10 min')}
 salvar();render()}

/* ================= camada nativa (Capacitor / APK) =================
   Quando o HTML for empacotado como APK com Capacitor + @capacitor/local-notifications,
   os alarmes dos próximos 30 dias são agendados no sistema e tocam com o app fechado. */
let nativoT=null;
function agendarNativoSoon(){clearTimeout(nativoT);nativoT=setTimeout(agendarNativo,2500)}
async function agendarNativo(){const C=window.Capacitor;if(!C||!(C.isNativePlatform&&C.isNativePlatform()))return;
 const LN=C.Plugins&&C.Plugins.LocalNotifications;if(!LN)return;
 try{const pend=await LN.getPending();if(pend.notifications&&pend.notifications.length)await LN.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
  try{await LN.createChannel({id:'agenda_alarmes',name:'Alarmes e lembretes',importance:5,visibility:1,vibration:true})}catch(e){}
  const lst=[],agora=Date.now();let seq=1;
  for(let o=0;o<30&&lst.length<400;o++){const d=addD(new Date(),o);
   for(const g of gatilhos(d))for(const min of offsetsDe(g)){const t=g.t-min*60000;if(t<=agora||lst.length>=400)continue;
    lst.push({id:seq++,title:S.cfg.ocultarNotif?'Agenda: lembrete':g.ic+' '+g.tit,body:S.cfg.ocultarNotif?'Toque para ver':corpoDe(g,min),schedule:{at:new Date(t),allowWhileIdle:true},channelId:'agenda_alarmes',extra:{key:g.src+':'+g.id+'|'+g.ds+'|'+min}})}}
  if(lst.length)await LN.schedule({notifications:lst})}catch(e){}}

/* ================= UI base ================= */
let abaAtual='inicio';
const ABAS=[['inicio','Início','home'],['cal','Agenda','cal'],['tarefas','Tarefas','check'],['lembretes','Alertas','bell'],['notas','Notas','note'],['config','Ajustes','cfg']];
const TITULOS={inicio:'Início',cal:'Calendário',tarefas:'Tarefas',lembretes:'Lembretes',notas:'Notas',config:'Configurações'};
const A={};
let lastDragEnd=0;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),3200)}
const stack=[];let histOK=true,nHist=0;
function sheet(html,cls=''){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="sheet ${cls}"><div class="gh"></div>${html}</div>`;
 let down=null;m.addEventListener('pointerdown',e=>{down=e.target});m.addEventListener('click',e=>{if(e.target===m&&down===m&&!cls.includes('nobd'))fechar()});
 $('#layer').appendChild(m);stack.push(m);if(stack.some(x=>x._fechando))m._nopush=true;else try{history.pushState({sh:stack.length},'');nHist++}catch(e){histOK=false}return m.firstChild}
function removerEl(m){const i=stack.indexOf(m);if(i<0)return;stack.splice(i,1);if(m._onClose)m._onClose();m.remove()}
function removerTopo(){removerEl(stack[stack.length-1])}
function fechar(){let m=null;for(let i=stack.length-1;i>=0;i--)if(!stack[i]._fechando){m=stack[i];break}if(!m)return;if(histOK&&nHist>0&&!m._nopush){m._fechando=true;nHist--;try{history.back();setTimeout(()=>removerEl(m),400);return}catch(e){nHist++;m._fechando=false}}removerEl(m)}
function fecharTudo(){while(stack.length)removerTopo()}
window.addEventListener('popstate',()=>{let m=stack.find(x=>x._fechando);if(!m){m=stack[stack.length-1];if(m&&nHist>0)nHist--}if(m)removerEl(m)});
const topo=()=>stack.length?stack[stack.length-1].firstChild:null;
document.addEventListener('click',e=>{
 const a=e.target.closest('[data-act]');
 if(a){if(Date.now()-lastDragEnd<500)return;const f=A[a.dataset.act];if(f){try{const r=f(a,e);if(r&&r.catch)r.catch(er=>{console.error(er);toast('Erro: '+er.message)})}catch(er){console.error(er);toast('Erro: '+er.message)}}return}
 const c=e.target.closest('.chips[data-grp] .chip');
 if(c){const g=c.parentElement;if(g.dataset.multi==='1')c.classList.toggle('on');else{$$('.chip',g).forEach(x=>x.classList.remove('on'));c.classList.add('on')}
  g.dispatchEvent(new CustomEvent('chips',{bubbles:true,detail:g.dataset.grp}))}});
function chips(grp,opts,sel,multi,cls=''){return `<div class="chips ${cls}" data-grp="${grp}" data-multi="${multi?1:0}">`+opts.map(o=>{const on=multi?(sel||[]).includes(o.v):sel===o.v;return `<button type="button" class="chip${on?' on':''}${o.sw?' sw':''}" data-v="${esc(o.v)}"${o.sw?` style="background:${o.sw}" aria-label="cor"`:''}>${o.l||''}</button>`}).join('')+'</div>'}
function lerChips(root,grp){const el=$(`.chips[data-grp="${grp}"]`,root);if(!el)return null;const v=$$('.chip.on',el).map(b=>b.dataset.v);return el.dataset.multi==='1'?v:(v[0]||'')}
function sw(id,on,rot,sub){return `<div class="srow"><div>${rot}${sub?`<small>${sub}</small>`:''}</div><label class="swt"><input type="checkbox" id="${id}"${on?' checked':''}><i></i></label></div>`}

/* ================= navegação ================= */
function renderTabs(){const pend=S.perdidos.length,atr=tarefasAtrasadas().length;
 $('#tabs').innerHTML=ABAS.map(([k,n,i])=>`<button class="${k===abaAtual?'on':''}" data-act="aba" data-k="${k}" aria-label="${n}">${ico(i,23)}<span>${n}</span>${(k==='lembretes'&&pend)?`<b class="bd">${pend}</b>`:''}${(k==='tarefas'&&atr)?`<b class="bd">${atr}</b>`:''}</button>`).join('')}
function ir(aba){abaAtual=aba;$$('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+aba));$('#fab').style.display=aba==='config'?'none':'';render(true);window.scrollTo(0,0)}
function render(top){const y=window.scrollY;renderCabecalho();renderTabs();renderAvisos();
 ({inicio:rInicio,cal:rCal,tarefas:rTarefas,lembretes:rLembretes,notas:rNotas,config:rConfig})[abaAtual]();
 if(!top)window.scrollTo(0,y)}
function renderCabecalho(){const n=new Date();$('#hTit').textContent=TITULOS[abaAtual];
 $('#hSub').innerHTML=`${esc(diaLongo(n))} · <span id="relogio">${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}</span>`;
 $('#bBusca').innerHTML=ico('search',20);$('#bSino').innerHTML=ico('bell',20)+(S.perdidos.length?`<b class="bd">${S.perdidos.length}</b>`:'')}

 if(S.perdidos.length)h+=`<div class="banner"><b>⚠️ ${S.perdidos.length} alerta(s) perdido(s)</b>`+S.perdidos.slice(0,4).map(p=>{const q=new Date(p.t);return `${p.ic||'🔔'} ${esc(p.titulo)} — ${pad(q.getDate())}/${pad(q.getMonth()+1)} ${pad(q.getHours())}:${pad(q.getMinutes())}<br>`}).join('')+`<div class="fl"><button class="btn sm sec" data-act="limpar-perdidos">Limpar</button></div></div>`;
 $('#avisos').innerHTML=h}

/* ================= componentes ================= */
function horaTxt(it){if(!it.hora)return'Dia todo';let s=fmtHora(it.hora);if(it.dur>0&&it.src==='ev')s+=' – '+fmtHora(hm(mins(it.hora)+it.dur));return s}

function rMes(){const y=ref.getFullYear(),m=ref.getMonth(),s0=S.cfg.sem0;const first=new Date(y,m,1),off=(first.getDay()-s0+7)%7,start=addD(first,-off),total=Math.ceil((off+new Date(y,m+1,0).getDate())/7)*7;

  if(i%7===0)g+=`<div class="wk">${isoWeek(addD(start,i+((4-s0+7)%7)))}</div>`;

function layoutCols(arr){arr.sort((a,b)=>a.s-b.s||b.e-a.e);let cl=[],cEnd=-1;const fl=()=>{const cols=[];cl.forEach(it=>{let c=cols.findIndex(e=>e<=it.s);if(c<0){c=cols.length;cols.push(0)}cols[c]=it.e;it.col=c});cl.forEach(it=>it.n=cols.length);cl=[]};
 arr.forEach(it=>{if(it.s>=cEnd&&cl.length)fl();cl.push(it);cEnd=cl.length===1?it.e:Math.max(cEnd,it.e)});fl();return arr}
function timeline(dias){const hojeS=ymd(new Date());let allday='<div class="allday">',cols='';
 dias.forEach(d=>{const ds=ymd(d),its=itensDoDia(d),fs=feriados(d.getFullYear())[ds]||[];
  const ad=its.filter(i=>!i.hora||i.src==='pe');
  allday+=`<div>${fs.filter(f=>f.t!=='c').map(f=>`<span style="--c:var(--red)">${esc(f.nm)}</span>`).join('')}${ad.map(i=>`<span style="--c:${i.cor}" data-act="abrir-item" data-src="${i.src}" data-id="${i.id}" data-ds="${i.ds}">${i.ic} ${esc(i.tit)}</span>`).join('')}</div>`;
  const tm=layoutCols(its.filter(i=>i.hora&&i.src!=='pe').map(i=>({i,s:mins(i.hora),e:Math.max(mins(i.hora)+Math.max(i.dur,25),mins(i.hora)+25)})));
  let b='';tm.forEach(o=>{const i=o.i,top=o.s/60*HH,hgt=Math.max(18,(i.dur||25)/60*HH-2);
   b+=`<div class="blk${i.done?' done':''}" style="--c:${i.cor};top:${top}px;height:${hgt}px;left:calc(${o.col/o.n*100}% + 1px);width:calc(${100/o.n}% - 2px)" data-act="abrir-item" data-src="${i.src}" data-id="${i.id}" data-ds="${i.ds}" data-drag="blk" data-min="${o.s}" data-dur="${i.dur||0}"><b>${i.ic} ${esc(i.tit)}</b>${hgt>34&&dias.length===1?fmtHora(i.hora):''}${hgt>48&&dias.length===1&&i.obj.local?'<br>📍 '+esc(i.obj.local):''}</div>`});
  if(ds===hojeS){const n=new Date();b+=`<div class="agora" style="top:${(n.getHours()*60+n.getMinutes())/60*HH}px"></div>`}
  cols+=`<div class="col${ds===hojeS?' hoje':''}" data-ds="${ds}" data-act="tl-vazio">${b}</div>`});
 allday+='</div>';
 let lines='',hrs='';for(let h=0;h<24;h++){lines+=`<div class="ln" style="top:${h*HH}px"></div>`;hrs+=`<span style="top:${h*HH}px">${h?(S.cfg.h12?(h%12||12)+(h<12?'a':'p'):pad(h)+':00'):''}</span>`}
 return `${allday}<div class="tlw"><div class="tl"><div class="hrs">${hrs}</div><div class="cols">${lines}${cols}</div></div></div>`}

 drag={el,x0:e.clientX,y0:e.clientY,on:false,id:e.pointerId};drag.timer=setTimeout(()=>{if(!drag)return;drag.on=true;navigator.vibrate&&navigator.vibrate(25);
  const tipo=el.dataset.drag;if(tipo==='lista'){el.classList.add('drag');const g=document.createElement('div');g.className='ghost';g.textContent=$('.tt',el).textContent;document.body.appendChild(g);drag.ghost=g;moveGhost(drag.x0,drag.y0)}else{el.classList.add('drag');drag.min0=+el.dataset.min;drag.cw=el.parentElement.getBoundingClientRect().width}},380)});
function moveGhost(x,y){if(drag&&drag.ghost){drag.ghost.style.left=Math.min(x+12,innerWidth-230)+'px';drag.ghost.style.top=(y-34)+'px'}}
document.addEventListener('pointermove',e=>{if(!drag)return;
 if(!drag.on){if(Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)>10){clearTimeout(drag.timer);drag=null}return}
 const dx=e.clientX-drag.x0,dy=e.clientY-drag.y0;
 if(drag.el.dataset.drag==='lista'){moveGhost(e.clientX,e.clientY);$$('.cell.alvo').forEach(c=>c.classList.remove('alvo'));const t=document.elementFromPoint(e.clientX,e.clientY);const c=t&&t.closest('.cell[data-d]');if(c)c.classList.add('alvo')}
 else{const snap=Math.round(dy/HH*4)*15,cols=$$('.col').length,dd=cols>1?Math.round(dx/drag.cw):0;drag.dm=snap;drag.dd=dd;drag.el.style.transform=`translate(${dd*drag.cw}px,${snap/60*HH}px)`;
  const nm=drag.min0+snap;let tip=$('#dragTip');if(!tip){tip=document.createElement('div');tip.id='dragTip';tip.className='ghost';document.body.appendChild(tip)}tip.textContent=fmtHora(hm(Math.max(0,Math.min(1439,nm))));tip.style.left=Math.min(e.clientX+14,innerWidth-80)+'px';tip.style.top=(e.clientY-50)+'px'}});
function fimDrag(e,cancel){if(!drag)return;clearTimeout(drag.timer);const d=drag;drag=null;if(!d.on)return;lastDragEnd=Date.now();
 d.el.classList.remove('drag');d.el.style.transform='';if(d.ghost)d.ghost.remove();const tip=$('#dragTip');if(tip)tip.remove();$$('.cell.alvo').forEach(c=>c.classList.remove('alvo'));if(cancel)return;
 const o=d.el.dataset;
 if(o.drag==='lista'){const t=document.elementFromPoint(e.clientX,e.clientY),c=t&&t.closest('.cell[data-d]');if(c&&c.dataset.d!==o.ds)moverItem(o.src,o.id,o.ds,c.dataset.d,null)}
 else{const nm=Math.max(0,Math.min(1439,(+o.min)+(d.dm||0)));const cols=$$('.col');const idx=cols.findIndex(c=>c.dataset.ds===o.ds);const ni=Math.max(0,Math.min(cols.length-1,idx+(d.dd||0)));
  if(nm!==+o.min||ni!==idx)moverItem(o.src,o.id,o.ds,cols[ni].dataset.ds,hm(nm))}}
document.addEventListener('pointerup',e=>fimDrag(e,false));document.addEventListener('pointercancel',e=>fimDrag(e,true));

// move uma ocorrência (ou o item todo, se não repete) para outra data/hora
function moverItem(src,id,ds,novaData,novaHora){
 if(src==='pe'){toast('Aniversários não podem ser movidos');return}
 const lista=src==='ev'?S.eventos:src==='ta'?S.tarefas:S.notas;const o=lista.find(x=>x.id===id);if(!o)return;
 const recorre=(src!=='no')&&o.rep&&o.rep!=='nao';
 if(recorre){const c=JSON.parse(JSON.stringify(o));c.id=uid();c.rep='nao';c.dias=[];c.ate='';c.excecoes=[];c.data=novaData;if(novaHora)c.hora=novaHora;c.done=false;
  (o.excecoes=o.excecoes||[]).push(ds);lista.push(c);limparFired(src,c.id);toast('Só esta ocorrência foi movida')}
 else{o.data=novaData;if(novaHora)o.hora=novaHora;limparFired(src,id);if(src==='ta'&&o.done)o.done=false;toast('Movido para '+fmtData(pY(novaData))+(novaHora?' às '+fmtHora(novaHora):''))}
 salvar();render()}

let tf='pend',tcat='',expTk=new Set();
const PRIOS=['Baixa','Média','Alta'];
function ordTarefa(a,b){const h=ymd(new Date());const la=!!(a.data&&a.data<h),lb=!!(b.data&&b.data<h);if(la!==lb)return la?-1:1;
 const da=a.data||'9999-99-99',db=b.data||'9999-99-99';if(da!==db)return da<db?-1:1;return (b.prio||0)-(a.prio||0)||(a.hora||'').localeCompare(b.hora||'')}
const progTarefa=t=>{const s=t.subs||[];return s.length?Math.round(s.filter(x=>x.done).length/s.length*100):(t.done?100:0)};
function cartaoTarefa(t,compact){const h=ymd(new Date()),late=!t.done&&t.data&&t.data<h,subs=t.subs||[],pg=progTarefa(t),exp=expTk.has(t.id)&&!compact;
 return `<div class="tk${t.done?' done':''}"${late?' style="border-color:var(--red)"':''}><div class="top"><button class="ck${t.done?' on':''}" data-act="tk-ck" data-id="${t.id}" aria-label="Concluir">✓</button>
 <div style="flex:1;min-width:0" data-act="tk-open" data-id="${t.id}"><div class="tt">${esc(t.titulo)}</div><div>${t.data?`<span class="tag${late?' late':''}">📅 ${rotuloDia(pY(t.data))}${t.hora?' '+fmtHora(t.hora):''}</span>`:''}<span class="tag p${t.prio||0}">⚑ ${PRIOS[t.prio||0]}</span><span class="tag">${catDe(t).ic} ${esc(catDe(t).nm)}</span>${t.rep&&t.rep!=='nao'?`<span class="tag">🔁 ${esc(lblRep(t))}</span>`:''}${t.avisar?'<span class="tag">🔔</span>':''}${(t.anexos||[]).length?`<span class="tag">📎 ${t.anexos.length}</span>`:''}${t.fav?'<span class="tag">⭐</span>':''}</div>
 ${subs.length?`<div class="prog"><i style="width:${pg}%"></i></div><div class="xs mut" style="margin-top:3px">${subs.filter(x=>x.done).length}/${subs.length} · ${pg}%</div>`:''}</div>
 ${subs.length&&!compact?`<button class="ib" style="width:32px;height:32px" data-act="tk-exp" data-id="${t.id}" aria-label="Subtarefas">${exp?'▴':'▾'}</button>`:''}</div>
 ${exp?`<div class="subs">${subs.map(x=>`<div class="sub${x.done?' done':''}"><button class="ck${x.done?' on':''}" data-act="sub-ck" data-id="${t.id}" data-sid="${x.id}" aria-label="Item">✓</button><span>${esc(x.t)}</span></div>`).join('')}</div>`:''}</div>`}
function rTarefas(){const h=ymd(new Date());const pend=S.tarefas.filter(t=>!t.done),conc=S.tarefas.filter(t=>t.done);
 let lst=tf==='pend'?pend:tf==='conc'?conc:S.tarefas;if(tcat)lst=lst.filter(t=>t.cat===tcat);
 lst=[...lst].sort(tf==='conc'?((a,b)=>(b.doneAt||0)-(a.doneAt||0)):ordTarefa);
 const taxa=S.tarefas.length?Math.round(conc.length/S.tarefas.length*100):0;
 let html=`<div class="seg">${[['pend',`Pendentes (${pend.length})`],['conc',`Concluídas (${conc.length})`],['todas','Todas']].map(([k,n])=>`<button class="${tf===k?'on':''}" data-act="tk-filtro" data-k="${k}">${n}</button>`).join('')}</div>
 <div class="row"><select class="in" id="tCat" style="flex:1"><option value="">Todas as categorias</option>${Object.entries(S.cats).map(([k,c])=>`<option value="${k}"${tcat===k?' selected':''}>${c.ic} ${esc(c.nm)}</option>`).join('')}</select><button class="btn" data-act="nova-tarefa">＋ Tarefa</button></div>
 ${S.tarefas.length?`<div class="sm mut" style="margin:8px 2px 0">${taxa}% concluídas · ${tarefasAtrasadas().length} atrasada(s)</div>`:''}`;
 html+=lst.length?lst.map(t=>cartaoTarefa(t)).join(''):`<div class="vazio"><b>${tf==='conc'?'Nenhuma tarefa concluída':'Nenhuma tarefa'}</b>${tf==='conc'?'':'Crie uma tarefa com prazo, prioridade, subtarefas e lembrete.'}${!S.tarefas.length&&!S.eventos.length&&!S.notas.length?'<div class="fl" style="justify-content:center"><button class="btn sm sec" data-act="exemplos">Carregar dados de exemplo</button></div>':''}</div>`;
 $('#v-tarefas').innerHTML=html}

 l=[...l].sort((a,b)=>(b.fixa?1:0)-(a.fixa?1:0)||(b.editada||0)-(a.editada||0));

 if(nf==='cofre'){

let _db=null;
function dbOpen(){return _db||(_db=new Promise((res,rej)=>{try{const r=indexedDB.open('agenda_inteligente',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('blobs');d.createObjectStore('snaps')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}}))}
async function dbPut(st,k,v){const d=await dbOpen();return new Promise((res,rej)=>{const t=d.transaction(st,'readwrite');t.objectStore(st).put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
async function dbGet(st,k){const d=await dbOpen();return new Promise((res,rej)=>{const q=d.transaction(st).objectStore(st).get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function dbDel(st,k){const d=await dbOpen();return new Promise((res,rej)=>{const t=d.transaction(st,'readwrite');t.objectStore(st).delete(k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
async function dbKeys(st){const d=await dbOpen();return new Promise((res,rej)=>{const q=d.transaction(st).objectStore(st).getAllKeys();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
function apagarAnexos(l){(l||[]).forEach(a=>dbDel('blobs',a.id).catch(()=>{}))}
const tamTxt=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
const icAnx=t=>t.startsWith('image/')?'🖼️':t.startsWith('audio/')?'🎙️':t==='application/pdf'?'📄':'📎';
function acharAnexo(id){for(const l of [S.eventos,S.tarefas,S.notas]){for(const o of l){const a=(o.anexos||[]).find(x=>x.id===id);if(a)return a}}return null}
function anxHTML(){return `<label class="l">Anexos</label><div class="anx" id="anx"></div><div class="fl"><button type="button" class="btn sm sec" data-act="anx-foto">📷 Foto</button><button type="button" class="btn sm sec" data-act="anx-arq">📎 Arquivo</button>${window.MediaRecorder?'<button type="button" class="btn sm sec" data-act="anx-voz" id="bVoz">🎙️ Gravar voz</button>':''}</div>`}
function anxInit(s,lista){s._anx={atual:[...(lista||[])],novos:[],orig:[...(lista||[])]};s.parentElement._onClose=()=>{if(!s._salvo)apagarAnexos(s._anx.novos)};anxRender(s)}
function anxRender(s){const el=$('#anx',s);if(!el)return;el.innerHTML=s._anx.atual.map(a=>`<div class="a"><span>${icAnx(a.tipo)} ${esc(a.nome)} <small class="mut">${tamTxt(a.tam)}</small></span><button type="button" class="btn sm sec" data-act="anx-abrir" data-id="${a.id}">Abrir</button><button type="button" class="btn sm sec" data-act="anx-rem" data-id="${a.id}" aria-label="Remover">✕</button></div>`).join('')}
function anxCommit(s){const x=s._anx;x.orig.filter(o=>!x.atual.some(a=>a.id===o.id)).forEach(o=>apagarAnexos([o]));s._salvo=true;return x.atual}
function pegarArquivo(accept,capture){return new Promise(res=>{const i=document.createElement('input');i.type='file';if(accept)i.accept=accept;if(capture)i.setAttribute('capture','environment');i.onchange=()=>res(i.files[0]||null);i.addEventListener('cancel',()=>res(null));i.click()})}
async function anxAdd(file){const s=topo();if(!s||!s._anx||!file)return;if(file.size>25*1048576){toast('Arquivo muito grande (máx. 25 MB)');return}
 try{const id=uid();await dbPut('blobs',id,file);const m={id,nome:file.name||'anexo',tipo:file.type||'application/octet-stream',tam:file.size};s._anx.atual.push(m);s._anx.novos.push(m);anxRender(s)}catch(e){toast('Não foi possível salvar o anexo neste navegador')}}

/* ================= PIN, cofre e biometria ================= */
const temCrypto=!!(window.crypto&&crypto.subtle);
const TE=new TextEncoder(),TD=new TextDecoder();
const b64=buf=>{const a=new Uint8Array(buf);let s='';for(let i=0;i<a.length;i+=8192)s+=String.fromCharCode.apply(null,a.subarray(i,i+8192));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let cofreKey=null;const cofreCache={};
async function derivarPin(pin,saltB64){const km=await crypto.subtle.importKey('raw',TE.encode(pin),'PBKDF2',false,['deriveBits']);
 const bits=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:unb64(saltB64),iterations:120000,hash:'SHA-256'},km,512));
 return{hash:b64(bits.slice(0,32)),key:await crypto.subtle.importKey('raw',bits.slice(32),'AES-GCM',false,['encrypt','decrypt'])}}
async function cifrarCom(key,obj){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,TE.encode(JSON.stringify(obj)));return b64(iv)+'.'+b64(ct)}
async function decifrarCom(key,str){const[i,c]=str.split('.');return JSON.parse(TD.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(i)},key,unb64(c))))}
const cofreCifrar=o=>cifrarCom(cofreKey,o),cofreDecifrar=s=>decifrarCom(cofreKey,s);
async function decifrarTodas(){for(const n of S.notas){if(n.priv&&n.enc){try{const d=await cofreDecifrar(n.enc);cofreCache[n.id]={titulo:d.titulo}}catch(e){}}}}
let padCtx=null;
const padHTML=len=>`<div class="pins">${'<i></i>'.repeat(len)}</div><div class="pad">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button data-act="pad" data-k="${k}">${k}</button>`).join('')}</div>`;
A.pad=a=>{if(!padCtx)return;const k=a.dataset.k;if(k==='⌫')padCtx.buf=padCtx.buf.slice(0,-1);else if(padCtx.buf.length<padCtx.len)padCtx.buf+=k;
 $$('.pins i',padCtx.root).forEach((d,i)=>d.classList.toggle('on',i<padCtx.buf.length));
 if(padCtx.buf.length===padCtx.len){const b=padCtx.buf,fn=padCtx.fn,root=padCtx.root;padCtx.buf='';setTimeout(()=>{$$('.pins i',root).forEach(d=>d.classList.remove('on'));fn(b)},120)}};
function pedirPin(titulo,len){len=len||S.cfg.pinLen||4;return new Promise(res=>{let feito=false;const s=sheet(`<h3 style="text-align:center">${titulo}</h3><div style="display:flex;flex-direction:column;align-items:center">${padHTML(len)}</div><div class="foot" style="justify-content:center"><button class="btn sec" data-act="fechar">Cancelar</button></div>`,'nobd');
 padCtx={buf:'',len,root:s,fn:pin=>{feito=true;padCtx=null;fechar();res(pin)}};s.parentElement._onClose=()=>{if(!feito){padCtx=null;res(null)}}})}
async function cofreAbrir(){if(!S.cfg.pinHash){toast('Defina um PIN em Ajustes › Privacidade');return false}if(!temCrypto){toast('Criptografia indisponível neste navegador/endereço');return false}
 const pin=await pedirPin('Digite o PIN do cofre');if(!pin)return false;const r=await derivarPin(pin,S.cfg.pinSalt);if(r.hash!==S.cfg.pinHash){toast('PIN incorreto');return false}
 cofreKey=r.key;await decifrarTodas();return true}
A['cofre-abrir']=async()=>{if(await cofreAbrir())render()};A['cofre-trancar']=()=>{cofreKey=null;render();toast('Cofre trancado')};

function mostrarLock(msg){const l=$('#lock');const len=S.cfg.pinLen||4;
 l.innerHTML=`<div style="font-size:2.6rem">🔒</div><h2 style="margin:6px 0 2px">Agenda Inteligente</h2><div class="mut sm" id="lkMsg">${msg||'Digite seu PIN'}</div>${padHTML(len)}${S.cfg.bio?'<button class="btn sec" data-act="lk-bio" style="margin-top:14px">👆 Usar biometria</button>':''}`;
 padCtx={buf:'',len,root:l,fn:async pin=>{const r=await derivarPin(pin,S.cfg.pinSalt);if(r.hash===S.cfg.pinHash){cofreKey=r.key;desbloquear();decifrarTodas()}else{const m=$('#lkMsg');if(m)m.textContent='PIN incorreto';vibrar(200)}}}}
function bloquear(){if(!S.cfg.pinHash||!temCrypto)return;$('#lock').classList.add('on');mostrarLock();if(S.cfg.bio)setTimeout(()=>A['lk-bio'](),300)}
function desbloquear(){$('#lock').classList.remove('on');padCtx=null;$('#lock').innerHTML='';if(atual)proximoAlertaRefresh()}
function proximoAlertaRefresh(){const p=atual;if(!p)return;$('#rTit').textContent=p.titulo;$('#rCorpo').textContent=p.corpo||''}
function verificarBloqueioAoVoltar(){if(!S.cfg.pinHash||$('#lock').classList.contains('on'))return;const lim=S.cfg.bloqueio;if(lim<0)return;if(Date.now()-hiddenAt>=lim*60000&&hiddenAt)bloquear()}
A['lk-bio']=async()=>{if(!S.cfg.bio)return;if(await bioVerificar()){desbloquear()}else{const m=$('#lkMsg');if(m)m.textContent='Biometria não reconhecida — use o PIN'}};
async function bioRegistrar(){if(!window.PublicKeyCredential||!isSecureContext){toast('Biometria exige endereço https e aparelho compatível');return false}
 try{const c=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'Agenda Inteligente'},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'usuario',displayName:S.cfg.nome||'Usuário'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000}});
  S.cfg.bio=b64(c.rawId);salvar();return true}catch(e){toast('Não foi possível ativar a biometria');return false}}
async function bioVerificar(){try{await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:unb64(S.cfg.bio)}],userVerification:'required',timeout:60000}});return true}catch(e){return false}}
A['pin-definir']=async()=>{if(!temCrypto){toast('Criptografia indisponível: abra por https ou localhost');return}
 const len=S.cfg.pinLen||4,p1=await pedirPin('Crie um PIN de '+len+' dígitos',len);if(!p1)return;const p2=await pedirPin('Repita o PIN',len);if(!p2)return;if(p1!==p2){toast('Os PINs não conferem');return}
 const salt=b64(crypto.getRandomValues(new Uint8Array(16))),r=await derivarPin(p1,salt);
 // se já havia cofre, recriptografa as notas com o novo PIN
 const antigas=[];if(cofreKey){for(const n of S.notas){if(n.priv&&n.enc){try{antigas.push([n,await cofreDecifrar(n.enc)])}catch(e){}}}}
 S.cfg.pinSalt=salt;S.cfg.pinHash=r.hash;cofreKey=r.key;for(const[n,d]of antigas)n.enc=await cofreCifrar(d);salvar();render();toast('PIN definido ✓')};
A['pin-remover']=async()=>{const pin=await pedirPin('Digite o PIN atual');if(!pin)return;const r=await derivarPin(pin,S.cfg.pinSalt);if(r.hash!==S.cfg.pinHash){toast('PIN incorreto');return}
 const priv=S.notas.filter(n=>n.priv&&n.enc);if(priv.length&&!confirm('Há '+priv.length+' nota(s) no cofre. Ao remover o PIN elas deixam de ser privadas (ficam sem criptografia). Continuar?'))return;
 for(const n of priv){try{const d=await decifrarCom(r.key,n.enc);Object.assign(n,d);n.enc='';n.priv=false}catch(e){}}
 S.cfg.pinHash='';S.cfg.pinSalt='';S.cfg.bio='';cofreKey=null;salvar();render();toast('PIN removido')};
A['bio-tog']=async a=>{if(S.cfg.bio){S.cfg.bio='';salvar();render();return}if(!S.cfg.pinHash){toast('Defina um PIN primeiro');return}if(await bioRegistrar()){render();toast('Biometria ativada ✓')}};

const blobB64=bl=>new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(bl)});
function dataUrlBlob(u){const i=u.indexOf(','),h=u.slice(0,i),m=/:(.*?);/.exec(h)[1],bin=atob(u.slice(i+1)),a=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)a[k]=bin.charCodeAt(k);return new Blob([a],{type:m})}
async function montarBackup(){const b={app:'agenda-inteligente',v:1,quando:new Date().toISOString(),dados:S,anexos:{}};
 try{const ks=await dbKeys('blobs');for(const k of ks){const bl=await dbGet('blobs',k);if(bl)b.anexos[k]=await blobB64(bl)}}catch(e){}return b}
async function arquivoBackup(){const b=await montarBackup();return new File([JSON.stringify(b)],`agenda-backup-${ymd(new Date())}.json`,{type:'application/json'})}
A['bk-exportar']=async()=>{toast('Gerando backup…');const f=await arquivoBackup();const u=URL.createObjectURL(f);const l=document.createElement('a');l.href=u;l.download=f.name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Backup exportado ✓')};
A['bk-compartilhar']=async()=>{const f=await arquivoBackup();if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:'Backup da Agenda'})}catch(e){}}else{toast('Compartilhamento indisponível — usando download');A['bk-exportar']()}};
A['bk-importar']=async()=>{const f=await pegarArquivo('.json,application/json');if(!f)return;
 try{const b=JSON.parse(await f.text());if(b.app!=='agenda-inteligente'||!b.dados)throw 0;if(!confirm('Substituir TODOS os dados atuais pelo backup de '+(b.quando||'').slice(0,10)+'?'))return;
  S=normalizar(b.dados);for(const[k,u]of Object.entries(b.anexos||{}))await dbPut('blobs',k,dataUrlBlob(u));cacheF={};salvarJa();aplicarTema();render();toast('Backup restaurado ✓')}catch(e){toast('Arquivo de backup inválido')}};
async function autoBackup(){if(!S.cfg.autoBackup)return;try{const k=ymd(new Date()),ks=await dbKeys('snaps');if(!ks.includes(k))await dbPut('snaps',k,JSON.stringify(S));
 const todas=(await dbKeys('snaps')).sort();while(todas.length>7)await dbDel('snaps',todas.shift())}catch(e){}}
async function listarSnaps(){const el=$('#snaps');if(!el)return;try{const ks=(await dbKeys('snaps')).sort().reverse();el.innerHTML=ks.length?`<label class="l">Cópias automáticas</label>`+ks.map(k=>`<div class="srow" style="padding:7px 0"><div>${fmtData(pY(k))}</div><button class="btn sm sec" data-act="snap-rest" data-k="${k}">Restaurar</button></div>`).join(''):''}catch(e){}}
A['snap-rest']=async a=>{try{const j=await dbGet('snaps',a.dataset.k);if(!j||!confirm('Restaurar a cópia de '+fmtData(pY(a.dataset.k))+'? Os dados atuais serão substituídos.'))return;S=normalizar(JSON.parse(j));cacheF={};salvarJa();aplicarTema();render();toast('Cópia restaurada')}catch(e){toast('Falha ao restaurar')}};
A['apagar-tudo']=async()=>{if(!confirm('Apagar TODOS os dados do app neste aparelho?')||!confirm('Tem certeza? Isso não pode ser desfeito.'))return;
 try{const ks=await dbKeys('blobs');for(const k of ks)await dbDel('blobs',k)}catch(e){}S=estadoVazio();cofreKey=null;localStorage.removeItem(KEY);localStorage.removeItem('ai_last');cacheF={};aplicarTema();render();toast('Tudo apagado')};

/* ================= PWA / início ================= */
function configurarPWA(){if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register('sw.js').then(r=>{swReg=r}).catch(()=>{});
  navigator.serviceWorker.addEventListener('message',e=>{const m=e.data||{};if(m.tipo==='acao')acaoDeNotificacao(m.acao,m.p)})}
 window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;if(abaAtual==='config')render()})}
function limparLixeira(){const lim=Date.now()-30*864e5;const n=S.notas.length;S.notas=S.notas.filter(x=>!(x.lixo&&x.lixo<lim));if(S.notas.length!==n)salvar()}
function processarURL(){try{const q=new URLSearchParams(location.search);const nv=q.get('novo');
  if(nv){setTimeout(()=>novoTipo(nv),400)}
  const ac=q.get('acao'),pp=q.get('p');if(ac&&pp){acaoDeNotificacao(ac,JSON.parse(pp))}
  if(nv||ac)history.replaceState(null,'',location.pathname)}catch(e){}}
function iniciar(){aplicarTema();limparLixeira();configurarPWA();autoBackup();ir('inicio');processarURL();if(S.cfg.pinHash)bloquear();iniciarTicker();aplicarWake();tick();agendarNativoSoon()}
iniciar();

})();
